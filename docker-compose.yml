services:
  db:
    image: postgres:16-alpine
    container_name: raizes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: raizes
      POSTGRES_PASSWORD: RaizesDB2026Macae
      POSTGRES_DB: raizes_db
    ports:
      - '5433:5432'
    volumes:
      - raizes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U raizes -d raizes_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raizes_pgdata:
